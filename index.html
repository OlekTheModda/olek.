<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>0l3k's Programming Hub</title>
  
  <!-- Cool Modern Fonts from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* Reset & Core Setup */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      font-family: 'Rajdhani', sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Animated RGB Canvas Background */
    canvas#bgCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Overlay Dark Grid Effect */
    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, transparent 20%, #050508 90%),
                  linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      z-index: 2;
      pointer-events: none;
    }

    /* Centered Content Box */
    .container {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 3rem 4rem;
      background: rgba(13, 15, 26, 0.65);
      border: 1px solid rgba(0, 255, 204, 0.2);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.15),
                  0 0 60px rgba(255, 0, 128, 0.1);
      max-width: 800px;
      width: 90%;
    }

    /* Glowing RGB Neon Main Title */
    h1.title {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #ff007f, #00f0ff, #00ff66, #ff007f);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: animatedGradient 5s ease infinite;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
      margin-bottom: 0.5rem;
    }

    /* Subtitle Styling */
    p.subtitle {
      font-family: 'Fira Code', monospace;
      font-size: 1.2rem;
      color: #a0aec0;
      margin-bottom: 2rem;
    }

    p.subtitle span {
      color: #00ff66;
    }

    /* Animated Discord RGB Button */
    .discord-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 36px;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-radius: 50px;
      background: linear-gradient(135deg, #5865F2, #ff007f, #00f0ff);
      background-size: 200% 200%;
      animation: animatedGradient 4s ease infinite;
      box-shadow: 0 0 20px rgba(88, 101, 242, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .discord-btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.8);
    }

    .discord-btn svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
    }

    /* Keyframe Animations */
    @keyframes animatedGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Mobile Responsive adjustments */
    @media (max-width: 600px) {
      h1.title { font-size: 2.2rem; }
      p.subtitle { font-size: 0.95rem; }
      .container { padding: 2rem 1.5rem; }
      .discord-btn { padding: 12px 24px; font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <!-- RGB Background Canvas -->
  <canvas id="bgCanvas"></canvas>

  <!-- Cyberpunk Grid Overlay -->
  <div class="grid-overlay"></div>

  <!-- Main Middle Content -->
  <div class="container">
    <h1 class="title">0l3k's Programming Hub</h1>
    <p.subtitle><span>&gt;</span> Coding, Tech &amp; Developer Community</p>

    <a href="https://discord.gg/ypAarjQShU" target="_blank" class="discord-btn">
      <!-- Discord SVG Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 127.14 96.36">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53Task.05s5-12.64,11.43-12.64c6.51,0,11.62,5.7,11.43,12.64C53.88,60,48.81,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53.05s5-12.64,11.44-12.64c6.5,0,11.62,5.7,11.43,12.64C96.12,60,91.08,65.69,84.69,65.69Z"/>
      </svg>
      Join Discord Server
    </a>
  </div>

  <!-- Background Particle Animation Script -->
  <script>
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 1.5;
        this.vy = (Math.random() - 0.5) * 1.5;
        this.size = Math.random() * 3 + 1;
        this.hue = Math.random() * 360;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.hue = (this.hue + 0.5) % 360;

        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = `hsl(${this.hue}, 100%, 60%)`;
        ctx.fill();
      }
    }

    for (let i = 0; i < 70; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();

        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 120) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `hsla(${particles[i].hue}, 100%, 50%, ${1 - distance / 120})`;
            ctx.lineWidth = 0.5;
            ctx.shadowBlur = 0;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
